[build]
  base = "frontend"
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  VITE_API_BASE_URL = "https://femmadexdrive.onrender.com/api"

[[redirects]]
  from = "/.netlify/functions/paystack-callback"
  to = "https://femmadexdrive.onrender.com/api/paystack-callback"
  status = 307
  force = true
